<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exhibition · Newspaper Night Sky</title>
<meta name="description" content="Newspaper Night Sky for a large screen: a self-running loop of scenes from the telescope, the pulses and the radio.">
__SITE_HEAD__
<style>
:root{color-scheme:dark;--bg:#050711;--ink:#edf2ff;--muted:#a2afc8;--gold:#ffd27a;--serif:Georgia,"Iowan Old Style","Times New Roman",serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
#stage{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
/* The scene's caption: large, low on the screen, on alternating sides (and nudged a little each time) against burn-in. */
.caption{position:fixed;bottom:4vh;max-width:min(46vw,900px);padding:2.2vh 2vw;border-radius:16px;background:#050711e6;border:1px solid #ffffff1f;
  box-shadow:0 10px 40px #000a;transition:opacity .8s ease,transform .8s ease;pointer-events:none;z-index:5}
.caption.left{left:3vw}.caption.right{right:3vw}.caption.hide{opacity:0;transform:translateY(12px)}
.caption .count{margin:0 0 .6vh;color:var(--gold);font:600 clamp(11px,.85vw,22px)/1.3 system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.caption h1{margin:0 0 .6vh;font:400 clamp(26px,2.6vw,64px)/1.1 var(--serif);letter-spacing:-.01em}
.caption p{margin:0;color:#c6d0e4;font-size:clamp(15px,1.25vw,30px);line-height:1.45}
.qr{position:fixed;top:3vh;right:2.5vw;z-index:5;display:flex;align-items:center;gap:1vw;padding:1.2vh 1vw;border-radius:12px;background:#050711d9;border:1px solid #ffffff1f;pointer-events:none;transition:opacity .8s}
.qr.left{right:auto;left:2.5vw}.qr svg{display:block;width:clamp(72px,6.5vw,150px);height:auto;background:#fff;border-radius:6px}
.qr span{max-width:11vw;color:var(--muted);font-size:clamp(11px,.8vw,18px);line-height:1.35}.qr.hide{opacity:0}
.dots{position:fixed;left:50%;top:1.2vh;transform:translateX(-50%);display:flex;gap:.2vw;z-index:8}
.dots button{display:grid;place-items:center;width:clamp(26px,1.6vw,44px);height:clamp(26px,1.6vw,44px);padding:0;border:0;border-radius:50%;background:none;cursor:pointer}.dots button::before{content:"";width:clamp(7px,.5vw,12px);height:clamp(7px,.5vw,12px);border-radius:50%;background:#ffffff40;transition:background .2s}.dots button:hover::before{background:#ffffffa0}.dots button[aria-current="true"]::before{background:var(--gold);box-shadow:0 0 8px var(--gold)}.dots button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.explore{position:fixed;left:50%;bottom:2vh;transform:translateX(-50%);z-index:6;padding:.8vh 1.2vw;border-radius:99px;background:#050711e6;border:1px solid #ffffff26;
  color:var(--muted);font-size:clamp(12px,.9vw,20px);display:none}.explore.show{display:block}
.start{position:fixed;inset:0;z-index:10;display:grid;place-items:center;text-align:center;background:radial-gradient(ellipse at 50% 40%,#101b32,#050711 70%);cursor:pointer}
.start h1{margin:0;font:400 clamp(34px,4.4vw,96px)/1.1 var(--serif)}.start p{color:var(--muted);font-size:clamp(15px,1.3vw,28px);margin:2vh 0 0}
.start small{display:block;margin-top:3vh;color:#6f7d99;font-size:clamp(12px,.9vw,18px)}
.start.gone{display:none}.start:focus-visible{outline:3px solid var(--gold);outline-offset:-10px}
body.still,body.still *{cursor:none!important}
@media(max-width:720px){.caption{max-width:none;left:12px!important;right:12px!important}.qr{display:none}}
</style>
</head>
<body>
<main><iframe id="stage" title="Exhibition scene" allow="autoplay; fullscreen"></iframe></main>
<nav class="dots" id="dots" aria-label="Scenes"></nav>
<div class="caption left hide" id="caption" aria-live="polite"><p class="count" id="count"></p><h1 id="title"></h1><p id="text"></p></div>
<div class="qr hide" id="qr" aria-hidden="true"><span id="qr-text">Continue on your phone</span></div>
<div class="explore" id="explore">Exploring · the tour returns after a minute without a touch</div>
<div class="start" id="start" role="button" tabindex="0"><div><h1>Newspaper Night Sky</h1><p>American newspapers, 1770–1810. Touch to begin.</p>
<small>Staff keys: F full screen · Space pause · ← → scene · M sound on or off</small></div></div>
<script type="application/json" id="exhibit-data">__EXHIBIT_DATA__</script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
(() => {
'use strict';
// The exhibition director: a loop of scenes, each one of the site's pages in its exhibition mode (?exhibit=1), shown in a
// frame with a large caption and a QR code for the same view on a phone. A touch inside a scene pauses the loop for
// exploring; a minute without a touch brings the tour back. Scenes change sides and nudge the caption against burn-in,
// and the page reloads itself once a day. Sound needs one touch first, unless the browser allows it (kiosk: start Chrome
// with --autoplay-policy=no-user-gesture-required).
const $ = id => document.getElementById(id);
const DATA = JSON.parse($('exhibit-data').textContent), SCENES = DATA.scenes;
const params = new URLSearchParams(location.search);
const IDLE = 60000;
let index = Math.max(0, Math.min(SCENES.length - 1, Number(params.get('scene')) - 1 || 0)), timer = 0, endsAt = 0, left = 0, paused = false, exploringUntil = 0, muted = false, watchdog = 0, fade = 0;

SCENES.forEach((s, k) => {   // a dot per scene: click one to go there (the tour carries on from it)
  const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', `Scene ${k + 1}: ${s.title}`); b.title = s.title;
  b.addEventListener('click', () => { exploringUntil = 0; $('explore').classList.remove('show'); paused = false; show(k); }); $('dots').append(b);
});
function qr(url) {
  const box = $('qr'); box.querySelector('svg')?.remove();
  if (typeof qrcode !== 'function') { box.classList.add('hide'); return; }   // offline: no code
  const q = qrcode(0, 'M'); q.addData(url); q.make();
  box.insertAdjacentHTML('afterbegin', q.createSvgTag({cellSize: 4, margin: 2, scalable: true}));
}
function show(i) {
  index = (i + SCENES.length) % SCENES.length; const s = SCENES[index], side = index % 2 ? 'right' : 'left';
  $('caption').classList.add('hide'); $('qr').classList.add('hide');
  clearTimeout(watchdog); watchdog = setTimeout(() => go(1), 25000);   // a scene that does not load is skipped
  $('stage').src = s.url;
  [...$('dots').children].forEach((d, k) => d.setAttribute('aria-current', String(k === index)));
  setTimeout(() => {
    $('count').textContent = `${index + 1} of ${SCENES.length}`; $('title').textContent = s.title; $('text').textContent = s.text;
    const c = $('caption'); c.className = 'caption ' + side + ' hide';
    c.style.bottom = (3 + Math.random() * 3).toFixed(1) + 'vh';   // a little higher or lower each time
    qr(DATA.pages + s.link); $('qr').className = 'qr hide';
    $('qr').style.top = (2.5 + Math.random() * 2).toFixed(1) + 'vh'; $('qr').style.right = (2 + Math.random() * 1.5).toFixed(1) + 'vw';
    requestAnimationFrame(() => { c.classList.remove('hide'); $('qr').classList.remove('hide'); });
    // The caption names the scene, then leaves the screen to it.
    clearTimeout(fade); fade = setTimeout(() => c.classList.add('hide'), Math.min(18000, s.seconds * 1000 * .45));
  }, 900);
  schedule(s.seconds * 1000);
}
function schedule(ms) { clearTimeout(timer); left = ms; endsAt = performance.now() + ms; if (!paused) timer = setTimeout(() => go(1), ms); }
function go(step) { show(index + step); }
function pause(on) {
  if (on === paused) return; paused = on;
  if (paused) { clearTimeout(timer); left = Math.max(0, endsAt - performance.now()); }
  else schedule(Math.max(left, 8000));
}
$('stage').addEventListener('load', () => {
  clearTimeout(watchdog);
  let doc; try { doc = $('stage').contentDocument; } catch { return; }
  if (!doc) return;
  if (muted) try { $('stage').contentWindow.Radio?.setVolume(0); } catch {}
  // A visitor exploring the scene: the loop waits, and comes back after a minute without a touch.
  for (const t of ['pointerdown', 'keydown', 'wheel']) doc.addEventListener(t, e => { if (!e.isTrusted) return; explore(); }, {capture: true, passive: true});
  doc.addEventListener('pointermove', stillness, {passive: true});
});
function explore() {
  exploringUntil = performance.now() + IDLE; pause(true);
  $('caption').classList.add('hide'); $('qr').classList.add('hide'); $('explore').classList.add('show');
}
setInterval(() => {
  if (exploringUntil && performance.now() > exploringUntil) { exploringUntil = 0; $('explore').classList.remove('show'); paused = false; go(1); }
}, 1000);
let still = 0;
function stillness() { document.body.classList.remove('still'); clearTimeout(still); still = setTimeout(() => document.body.classList.add('still'), 3000); }
document.addEventListener('pointermove', stillness);
document.addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
  else if (e.key === ' ') { e.preventDefault(); pause(!paused); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { exploringUntil = 0; $('explore').classList.remove('show'); paused = false; go(e.key === 'ArrowRight' ? 1 : -1); }
  else if (e.key === 'm' || e.key === 'M') { muted = !muted; try { $('stage').contentWindow.Radio?.setVolume(muted ? 0 : .8); } catch {} }
});
function begin() {
  $('start').classList.add('gone'); stillness();
  document.documentElement.requestFullscreen?.().catch(() => {});
  show(index);
}
$('start').addEventListener('click', begin);
$('start').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); begin(); } });
if (params.get('autostart') === '1') begin();
// Once a day, at four in the morning, a fresh start.
const next4 = new Date(); next4.setHours(4, 0, 0, 0); if (next4 <= new Date()) next4.setDate(next4.getDate() + 1);
setTimeout(() => location.reload(), next4 - new Date());
})();
</script>
</body>
</html>
